services:
  - type: web
    name: emsp-backend
    env: python
    buildCommand: pip install -r requirements.txt && cd emsp2-frontend && npm ci && npm run build && cd .. && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn emsp1.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --access-logfile -
