providers = ["python"]

[phases.setup]
nixPkgs = [
  "...",
  "nodejs_20",
  "pkg-config",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "libffi",
]

[phases.frontend_install]
dependsOn = ["install"]
cmds = ["cd emsp2-frontend && npm ci"]

[phases.frontend_build]
dependsOn = ["frontend_install"]
cmds = ["cd emsp2-frontend && npm run build"]

[phases.collectstatic]
dependsOn = ["frontend_build"]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate && uvicorn emsp1.asgi:application --host 0.0.0.0 --port $PORT --proxy-headers"
